    <p class="t-label">Work Tracker</p>
    <h1>Privacy</h1>
    <p>The app writes the week to ~/.weekly-tracker on the computer that runs it. It does not send that file anywhere. The in-app update check asks GitHub whether a newer release tag exists.</p>
    <p>This page is a static file. It sets no cookie and keeps no account.</p>
