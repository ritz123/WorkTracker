# Publishes advert/ as the GitHub Pages site. The folder is the site root,
# so the relative links in index.html (assets/, shots/, privacy.html) resolve
# on https://ritz123.github.io/WorkTracker/. Pages cannot publish an arbitrary
# folder from a branch; the choices there are / and /docs only.
name: Publish the landing page

on:
  push:
    branches: [main]
    paths:
      - advert/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: advert

      - id: deployment
        uses: actions/deploy-pages@v5
