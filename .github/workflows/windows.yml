name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        run: cargo build --release --bin weekly_work_tracker

      - name: Build the setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force packaging\windows\stage | Out-Null
          Copy-Item target\release\weekly_work_tracker.exe packaging\windows\stage\WorkTracker.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "packaging\windows\worktracker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "packaging\windows\output\WorkTracker-$version-setup.exe" WorkTracker-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-windows
          path: WorkTracker-setup.exe
          if-no-files-found: error
