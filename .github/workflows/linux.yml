name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install window-system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        run: cargo build --release --bin weekly_work_tracker

      - name: Name the executable
        run: cp target/release/weekly_work_tracker WorkTracker

      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-linux
          path: WorkTracker
          if-no-files-found: error
