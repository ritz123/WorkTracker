name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            asset: WorkTracker
          - os: windows-latest
            name: Windows
            asset: WorkTracker.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install window-system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag is the release version. It has to be the same number as
      # Cargo.toml, which is also the version the app reports at runtime.
      - name: Require the tag to match Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$tag version=$ver"
          test -n "$ver"
          test "$tag" = "$ver"

      - name: Test
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        run: cargo build --release --bin weekly_work_tracker

      - name: Stage the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/weekly_work_tracker.exe "${{ matrix.asset }}"
          else
            cp target/release/weekly_work_tracker "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/WorkTracker
            dist/WorkTracker.exe
