name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Install window-system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag is the version. build.rs reads WORK_TRACKER_VERSION and the
      # binary reports that number. A tag that is not vMAJOR.MINOR.PATCH is
      # rejected so the in-app update check can compare it.
      - name: Check the tag is a version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Test
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --bin weekly_work_tracker

      - name: Stage the binary
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/weekly_work_tracker.exe "WorkTracker-${tag}-windows.exe"
          else
            cp target/release/weekly_work_tracker "WorkTracker-${tag}-linux"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: WorkTracker-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
