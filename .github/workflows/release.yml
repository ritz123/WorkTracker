name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not ubuntu-latest. The AppImage keeps the glibc of the distro
          # that built it. 22.04's glibc 2.35 still starts on current desktops;
          # the newer glibc on ubuntu-latest refuses to load on 22.04.
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          # No macOS job. This repository's GitHub plan has no macOS runners,
          # so a macos-latest entry fails the whole release before publish.
    steps:
      - uses: actions/checkout@v4

      - name: Install window-system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev \
            librsvg2-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            dpkg-dev \
            file \
            zenity

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag is the version. build.rs reads WORK_TRACKER_VERSION and the
      # binary reports that number. A tag that is not vMAJOR.MINOR.PATCH is
      # rejected so the in-app update check can compare it.
      - name: Check the tag is a version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Test
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --bin weekly_work_tracker

      # One file for the release: WorkTracker-<version>-x86_64.AppImage.
      # linuxdeploy copies the binary and zenity, then their shared libraries,
      # into an AppDir and packs it. Import and Export run `zenity` from PATH;
      # the AppImage AppRun puts its usr/bin first, so the bundled zenity is
      # the one that opens. The host does not need zenity installed.
      # libGL is left out by linuxdeploy's excludelist: the graphics driver has
      # to be the machine's own, or NVIDIA and AMD stop drawing.
      # APPIMAGE_EXTRACT_AND_RUN: the runner has no FUSE mount, so the packager
      # extracts itself instead of mounting. NO_STRIP: a second strip pass can
      # break the Rust binary cargo already stripped.
      - name: Package the Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          appdir="$PWD/AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin"
          install -m 755 target/release/weekly_work_tracker "$appdir/usr/bin/worktracker"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Work Tracker' \
            'Exec=worktracker' \
            'Icon=worktracker' \
            'Categories=Office;' \
            'Terminal=false' \
            > "$RUNNER_TEMP/worktracker.desktop"
          # linuxdeploy keeps this file as AppRun.wrapped and writes the real
          # AppRun, which sources the GTK plugin hook and then execs this file.
          # The hook points zenity at the schemas and modules inside the image.
          # usr/bin is first on PATH so Import and Export find that zenity.
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'here=$(dirname "$(readlink -f "$0")")' \
            'export PATH="$here/usr/bin:$PATH"' \
            'if [ -d "$here/apprun-hooks" ]; then' \
            '  for hook in "$here"/apprun-hooks/*.sh; do' \
            '    [ -f "$hook" ] && . "$hook"' \
            '  done' \
            'fi' \
            'exec "$here/usr/bin/worktracker" "$@"' \
            > "$RUNNER_TEMP/AppRun"
          chmod +x "$RUNNER_TEMP/AppRun"

          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          # Pinned on purpose. The "continuous" linuxdeploy asset is rebuilt
          # without a version, and the GTK plugin publishes no release file:
          # its README is a shell script. A floating URL can change the packager
          # between two tags of this app and produce a different AppImage.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$tools/linuxdeploy-plugin-gtk.sh" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/raw/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          chmod +x "$tools/linuxdeploy" "$tools/linuxdeploy-plugin-gtk.sh"

          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          export VERSION="$tag"
          export LINUXDEPLOY_OUTPUT_VERSION="$tag"
          export NO_STRIP=1
          export DEPLOY_GTK_VERSION=3
          export PATH="$tools:$PATH"
          "$tools/linuxdeploy" --appdir "$appdir" \
            --executable "$appdir/usr/bin/worktracker" \
            --executable /usr/bin/zenity \
            --desktop-file "$RUNNER_TEMP/worktracker.desktop" \
            --icon-file packaging/icon/worktracker.png \
            --custom-apprun "$RUNNER_TEMP/AppRun" \
            --plugin gtk \
            --output appimage

          shopt -s nullglob
          files=()
          for f in ./*.AppImage; do
            case "$(basename "$f")" in
              linuxdeploy*|appimagetool*) continue ;;
            esac
            files+=("$f")
          done
          test "${#files[@]}" -eq 1
          mv "${files[0]}" "WorkTracker-${tag}-x86_64.AppImage"
          chmod +x "WorkTracker-${tag}-x86_64.AppImage"

      # A setup program, not the loose executable. Inno Setup installs it for
      # the current user and adds the Start menu shortcut. The plain exe is
      # only an input to the installer.
      - name: Build the Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $tag = $env:GITHUB_REF_NAME
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          New-Item -ItemType Directory -Force packaging\windows\stage | Out-Null
          Copy-Item target\release\weekly_work_tracker.exe packaging\windows\stage\WorkTracker.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$tag" "packaging\windows\worktracker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "packaging\windows\output\WorkTracker-$tag-setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: WorkTracker-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
