name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner only supplies Docker. The AppImage is linked inside
          # Rocky Linux 8 by packaging/linux/appimage.sh. Ubuntu 22.04's
          # glibc 2.35 made WorkTracker-0.3.7 fail on glibc 2.28 hosts.
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          # No macOS job. This repository's GitHub plan has no macOS runners,
          # so a macos-latest entry fails the whole release before publish.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'

      # The tag is the version. build.rs reads WORK_TRACKER_VERSION and the
      # binary reports that number. A tag that is not vMAJOR.MINOR.PATCH is
      # rejected so the in-app update check can compare it.
      - name: Check the tag is a version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Test
        if: runner.os == 'Windows'
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        if: runner.os == 'Windows'
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --bin weekly_work_tracker

      # Docker is the runner's. The compile happens in Rocky Linux 8 so the
      # AppImage links glibc 2.28. See packaging/linux/appimage.sh.
      - name: Test, build, and package the Linux AppImage
        if: runner.os == 'Linux'
        env:
          WORK_TRACKER_VERSION: ${{ github.ref_name }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e WORK_TRACKER_VERSION \
            -e GITHUB_REF_NAME \
            rockylinux:8 \
            bash /src/packaging/linux/appimage.sh

      # A setup program, not the loose executable. Inno Setup installs it for
      # the current user and adds the Start menu shortcut. The plain exe is
      # only an input to the installer.
      - name: Build the Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $tag = $env:GITHUB_REF_NAME
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          New-Item -ItemType Directory -Force packaging\windows\stage | Out-Null
          Copy-Item target\release\weekly_work_tracker.exe packaging\windows\stage\WorkTracker.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$tag" "packaging\windows\worktracker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "packaging\windows\output\WorkTracker-$tag-setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: WorkTracker-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
