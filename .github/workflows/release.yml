name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Install window-system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The pushed tag is the version bump. Stamp it into Cargo.toml before
      # compiling so the binary reports that number, even when the tagged
      # commit still has an older `version` field. Only vMAJOR.MINOR.PATCH
      # is accepted; anything else would not compare cleanly in the update check.
      - name: Stamp the tag version into the build
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag"
          echo "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          awk -v ver="$tag" '
            BEGIN { done = 0 }
            /^version = / && !done {
              print "version = \"" ver "\""
              done = 1
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.stamped
          grep -q "^version = \"$tag\"$" Cargo.toml.stamped
          mv Cargo.toml.stamped Cargo.toml
          grep -n '^version = ' Cargo.toml

      - name: Test
        run: cargo test --bin weekly_work_tracker

      - name: Release build
        run: cargo build --release --bin weekly_work_tracker

      - name: Stage the binary
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/weekly_work_tracker.exe "WorkTracker-${tag}-windows.exe"
          else
            cp target/release/weekly_work_tracker "WorkTracker-${tag}-linux"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: WorkTracker-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
